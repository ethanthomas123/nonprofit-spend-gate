[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonprofit-spend-gate"
version = "0.1.0"
description = "A typed Python example that gates nonprofit workload by a monthly Infrai cap"
requires-python = ">=3.10"
dependencies = ["openai>=1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]

